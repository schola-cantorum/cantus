# Project defaults; effective only after this checkout is trusted locally.
# Account credentials, project trust and model selection stay in the host.
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"

[agents]
enabled = true
max_concurrent_threads_per_session = 4

[sandbox_workspace_write]
network_access = false

# CodeGraph code-intelligence MCP server (docs/agents/runtime.md#codegraph-mcp).
# Pinned to the version docs/codegraph/ snapshots use; DO_NOT_TRACK disables its telemetry.
[mcp_servers.codegraph]
command = "npx"
args = ["-y", "@colbymchenry/codegraph@1.6.2", "serve", "--mcp"]
env = { DO_NOT_TRACK = "1" }
startup_timeout_sec = 60
