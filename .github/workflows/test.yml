name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint results do not vary by platform or Python version, so this job pins a
  # single runner instead of repeating the test job's matrix. It runs `ruff
  # check` plus `mypy cantus` (the strict baseline declared in pyproject);
  # formatting is deliberately not enforced (see CONTRIBUTING).
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install cantus with dev + serve + providers + tui + huggingface extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,serve,providers,tui,huggingface]"

      - name: Run ruff
        run: ruff check .

      - name: Run mypy (strict baseline, cantus package)
        run: mypy cantus

  test:
    name: pytest on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install cantus with dev + serve + providers + tui + huggingface extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,serve,providers,tui,huggingface]"

      - name: Run pytest
        run: pytest
