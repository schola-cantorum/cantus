name: supply-chain

# Implements ARCH-2 audit item 7 (dependency supply-chain check); the decision
# to run it here rather than inside the framework is ADR-0001.
#
# This lives in its own workflow rather than as a step in `test.yml` so that a
# supply-chain red and a test red are distinguishable at a glance: they are
# different findings and they are acted on differently.
#
# The schedule matters as much as the pull-request trigger. An advisory
# published after the last merge would otherwise never be noticed — nothing
# about this repository changes when a CVE lands against one of its transitive
# dependencies.

on:
  pull_request:
  schedule:
    # Mondays, 04:17 UTC. Off the hour so the run is not queued behind the
    # thundering herd of :00 cron jobs.
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Gate D audit M6: state the token scope explicitly; this workflow only verifies.
permissions:
  contents: read

jobs:
  audit:
    # `pyproject.toml` declares mutually exclusive extras — the agent-runtime
    # extra conflicts with every provider extra, and the two local-model extras
    # conflict with each other — so no single install covers the whole surface
    # and `uv export --all-extras` refuses outright. These three groups between
    # them do cover it. Dropping one silently narrows the audit, which is why
    # tests/test_guardrail_config.py asserts all three are present.
    name: pip-audit (${{ matrix.group }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Everything except the two conflicting groups below.
          - group: main
            extras: "all,serve,tui,mcp,langchain,dspy,huggingface"
            os: ubuntu-latest
            python: "3.12"
          # Pinned to 3.12 by its own environment marker. This is the group
          # that carries litellm — the dependency the ARCH-2 item was written
          # about — so an audit that skipped it would miss its own motivating
          # case.
          - group: openhands
            extras: "openhands"
            os: ubuntu-latest
            python: "3.12"
            # No group-scoped acknowledgement: the 42 pillow 12.3.0 IDs that
            # T-0021 acknowledged here were removed once this extra resolved
            # pillow 13.0.0, which fixes them (T-0020, 2026-11-20).
          # Its environment marker restricts it to darwin/arm64, so on a Linux
          # runner this group would install nothing and audit nothing.
          - group: mlx
            extras: "mlx"
            os: macos-latest
            python: "3.12"

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # Resolved with uv, not pip. pip backtracks through hundreds of versions
      # on the `main` group and gives up with `resolution-too-deep` after
      # several minutes; uv resolves the same 142-package set in seconds. uv is
      # also this project's own resolver — `uv.lock` and `[tool.uv].conflicts`
      # are what the extras were designed against — so auditing what uv installs
      # is auditing what a user actually gets. Same action and pin as
      # cross-platform-install.yml.
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install cantus with the ${{ matrix.group }} extras
        run: uv pip install --system ".[${{ matrix.extras }}]"

      - name: Install pip-audit
        run: uv pip install --system pip-audit

      # The runner's own pip is in the audited environment and its shipped
      # version carries an advisory of its own. That is toolchain, not a cantus
      # dependency, so it is fixed rather than acknowledged.
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # Audits the environment that is actually installed, rather than a
      # resolved requirements file. Requirements-file mode makes pip-audit build
      # its own virtual environment to resolve into, which is an extra failure
      # surface — it aborted hard during prototyping — and it would audit what
      # the project declares rather than what a user ends up with.
      #
      # A finding fails this job by design. To acknowledge an advisory that
      # cannot be acted on, add its ID WITH a comment naming the advisory and
      # why it is unactionable: on the matrix entry (`acknowledged`, see below)
      # when only one group installs the package, otherwise as
      # `--ignore-vuln <ID>` in the shared list below. Do not reach for
      # `continue-on-error`: a warning nobody reads is not a guardrail, which is
      # the failure this whole workflow exists to correct.
      #
      # ACKNOWLEDGED ADVISORIES — the backlog this audit found on its first
      # successful run. All 19 enter through the heavy optional extras
      # (`dspy`, `langchain`, `runtime`); the surface a reader installs with
      # `cantus-agent[serve]` carries none of them. Remediation is tracked in
      # the supply-chain-backlog ticket (frozen under .proj.tickets/_legacy/pending/
      # until revived with a T-NNNN id) and is deliberately NOT
      # part of the change that introduced this workflow: detection and
      # remediation are separate decisions. Four remain as of T-0003
      # (2026-11-10), all through `dspy` / `langchain`; the backlog ticket's
      # log records each removal.
      #
      # An advisory that only one group installs is acknowledged on that
      # group's matrix entry instead (`acknowledged`, space-separated IDs, with
      # its own comment), so it cannot hide the same finding in another group.
      # It must name the exact version it was written for in
      # `acknowledged_for` (`<package>==<version>`); the step fails when a
      # different version is installed, so a lifted pin cannot leave stale
      # IDs behind. As of 2026-11-20 no group has one: `openhands` carried 42
      # pillow 12.3.0 IDs from T-0021 until the extra resolved pillow 13.0.0.
      #
      # Nothing outside these lists is acknowledged. A newly published advisory,
      # against any package in any of the three groups, still fails the job.
      # Remove an entry the moment its package is bumped past the fix version.
      - name: Audit installed dependencies
        env:
          # Passed through the environment, not interpolated into the script.
          GROUP_ACKNOWLEDGED: ${{ matrix.acknowledged }}
          GROUP_ACKNOWLEDGED_FOR: ${{ matrix.acknowledged_for }}
        run: |
          read -r -a acked <<< "$GROUP_ACKNOWLEDGED"
          group_ignores=()
          for id in "${acked[@]}"; do
            group_ignores+=(--ignore-vuln "$id")
          done
          # A stale acknowledgement fails the job, but only after the audit
          # runs, so new findings in this group stay visible meanwhile.
          stale=""
          if [ ${#group_ignores[@]} -gt 0 ]; then
            pkg="${GROUP_ACKNOWLEDGED_FOR%%==*}"
            want="${GROUP_ACKNOWLEDGED_FOR#*==}"
            have="$(python -c 'import sys, importlib.metadata as m; print(m.version(sys.argv[1]))' "$pkg" || echo none)"
            if [ -z "$GROUP_ACKNOWLEDGED_FOR" ] || [ "$have" != "$want" ]; then
              stale="Group-scoped acknowledgements are for '${GROUP_ACKNOWLEDGED_FOR}' but ${pkg:-?} ${have} is installed. Delete 'acknowledged' and 'acknowledged_for' from this group's matrix entry (see its comment)."
            fi
          fi
          echo "Group-scoped acknowledgements: $(( ${#group_ignores[@]} / 2 ))"
          audit_rc=0
          pip-audit --progress-spinner=off "${group_ignores[@]}" \
            `# diskcache 5.6.3 — via dspy and outlines; no fix version published` \
            --ignore-vuln PYSEC-2026-2447 \
            `# langchain-core 0.3.86 — via langchain; fixed in 1.2.11 / 1.2.22` \
            --ignore-vuln PYSEC-2026-2193 \
            --ignore-vuln PYSEC-2026-2562 \
            `# langsmith 0.8.5 — via langchain-core; fixed in 0.8.18` \
            --ignore-vuln GHSA-f4xh-w4cj-qxq8 \
            || audit_rc=$?
          if [ -n "$stale" ]; then
            echo "::error::$stale"
            exit 1
          fi
          exit "$audit_rc"
