name: repo-hygiene

on:
  push:
    branches: [main]
  pull_request:

# Gate D audit M6: state the token scope explicitly; this workflow only verifies.
permissions:
  contents: read

jobs:
  no-dev-paths:
    name: No development-environment paths in tracked files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          # Full history is unnecessary; the guard scans the current tree only.
          fetch-depth: 1

      - name: Guard against development-environment path leakage
        run: bash scripts/check_no_dev_paths.sh

  collaboration-structure:
    name: Collaboration structure (harness-agile verify-project)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Control for ADR-0009 (drift diagnosis stays explicitly invoked) and the
      # structural half of the harness-agile adoption (ADR-0010, ADR-0011).
      # Checks the shared entrypoints, both runtime skill trees, invocation
      # policies, sanitizers, skill provenance and runtime roles. It uses only
      # the standard library (tomllib, so Python 3.11+); ubuntu-latest's
      # system python3 satisfies that without a setup step.
      - name: Verify collaboration structure
        run: python3 scripts/verify-project.py
